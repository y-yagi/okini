name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'pnpm'
    - name: Show node version
      run: node -v
    - name: Run pnpm install
      run: pnpm install
    - name: Run prettier
      run: pnpm pretty-check
    - name: Run test
      run: pnpm test

